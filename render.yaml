# Blueprint Render untuk aplikasi GPI Cipayung (Docker).
# Render → New → Blueprint → pilih repo ini. SESSION_SECRET dibuat otomatis.
#
# Database MySQL/MariaDB TIDAK disediakan Render; isi DB_* dengan database eksternal
# (Aiven, Railway, PlanetScale, atau server sendiri). Untuk bot WhatsApp yang tetap
# hidup dan sesi yang tidak hilang saat deploy, gunakan paket berbayar + disk.
services:
  - type: web
    name: gpi-cipayung
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: gpi_cipayung
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        sync: false
      - key: WA_LINKED_SESSION_DIR
        value: /data/wa-session
      - key: WA_LINKED_NO_SANDBOX
        value: "1"
      - key: TZ
        value: Asia/Jakarta
      - key: WA_REMINDER_AUTO
        value: "1"
      - key: WA_REMINDER_HOUR
        value: "8"
